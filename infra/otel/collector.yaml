# OTel Collector: nimmt OTLP/HTTP von OpenClaws diagnostics-otel an,
# gibt Metriken an Prometheus weiter. Traces und Logs landen vorerst nur im Debug-Log
# (Tempo erst, wenn du Traces vermisst — docs/architektur.html P0).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name usw. werden Labels — sonst sind alle OpenClaw-Metriken ohne Herkunft
    resource_to_telemetry_conversion:
      enabled: true
    # Default 5m: Zähler ohne neue Werte verschwinden aus /metrics, und mit ihnen die Kosten „seit Start".
    # Ein Gateway, das eine Stunde nichts tut, soll seine Zähler behalten.
    metric_expiration: 72h
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
