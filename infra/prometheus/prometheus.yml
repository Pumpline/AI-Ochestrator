global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Alles, was OpenClaw per OTLP an den Collector schickt, kommt hier raus.
  # Metriknamen werden dabei normalisiert: openclaw.cost.usd -> openclaw_cost_usd
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
